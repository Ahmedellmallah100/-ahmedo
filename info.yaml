# Tiny Tapeout project information
project:
  title:        "8-bit RISC CPU with MMIO Peripherals"
  author:       "MS College of Engineering"
  discord:      ""
  description:  "An 8-bit RISC CPU with memory-mapped UART, GPIO, and timer peripherals."
  language:     "Verilog"
  clock_hz:     10000000

  # One tile
  tiles: "1x1"

  top_module:  "tt_um_8bit_risc_cpu"

  source_files:
    - "tt_um_8bit_risc_cpu.v"
    - "CPU_Core.v"
    - "Program_Counter.v"
    - "PCplus4Adder.v"
    - "Adder.v"
    - "Registers.v"
    - "Control_Unit.v"
    - "Imm_Gen.v"
    - "ALU.v"
    - "Branch_Control.v"
    - "Mux1.v"
    - "Data_Memory.v"
    - "Peripheral_Block.v"
    - "UART_TX.v"
    - "Timer.v"

# Pinout of the project
pinout:
  # Inputs
  ui[0]: "INSTRUCTION[15]"
  ui[1]: "INSTRUCTION[14]"
  ui[2]: "INSTRUCTION[13]"
  ui[3]: "INSTRUCTION[12]"
  ui[4]: "INSTRUCTION[11]"
  ui[5]: "INSTRUCTION[10]"
  ui[6]: "INSTRUCTION[9]"
  ui[7]: "INSTRUCTION[8]"

  # Outputs
  uo[0]: "OUTPUT[0]"
  uo[1]: "OUTPUT[1]"
  uo[2]: "OUTPUT[2]"
  uo[3]: "OUTPUT[3]"
  uo[4]: "OUTPUT[4]"
  uo[5]: "OUTPUT[5]"
  uo[6]: "OUTPUT[6]"
  uo[7]: "OUTPUT[7]"

  # Bidirectional pins
  uio[0]: "INSTRUCTION[7]"
  uio[1]: "INSTRUCTION[6]"
  uio[2]: "INSTRUCTION[5]"
  uio[3]: "INSTRUCTION[4]"
  uio[4]: "INSTRUCTION[3]"
  uio[5]: "INSTRUCTION[2]"
  uio[6]: "INSTRUCTION[1]"
  uio[7]: "INSTRUCTION[0]"

# Do not change!
yaml_version: 6
